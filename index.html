<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pitt: Exposure</title>

<style>
:root {
  --bg: #e9eceb;
  --paper: #f7f7f3;
  --ink: #1e2528;
  --muted: #667176;
  --line: #c8cfcd;
  --strong: #26383d;
  --alert: #775d34;
  --shadow: 0 14px 45px rgba(22,31,34,.12);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  line-height: 1.62;
}

button { cursor: pointer; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 11px 18px;
  background: rgba(247,247,243,.96);
  border-bottom: 1px solid var(--line);
  font-family: Arial, Helvetica, sans-serif;
}

.brand {
  font-weight: 800;
  letter-spacing: .08em;
  font-size: .86rem;
}

.subbrand {
  font-weight: 400;
  color: var(--muted);
  margin-left: 8px;
}

.iconbtn {
  border: 1px solid var(--line);
  background: white;
  color: var(--strong);
  padding: 7px 10px;
  border-radius: 4px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: .82rem;
  font-weight: 700;
}

.wrap {
  max-width: 900px;
  margin: 28px auto 80px;
  padding: 0 18px;
}

.card {
  background: var(--paper);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  padding: clamp(25px,5vw,58px);
}

.eyebrow,
.timestamp,
.location,
.character,
.artifact-label,
.result-kicker {
  font-family: Arial, Helvetica, sans-serif;
  text-transform: uppercase;
  letter-spacing: .11em;
}

.eyebrow {
  font-size: .73rem;
  color: var(--muted);
  font-weight: 700;
}

h1, h2, h3 {
  line-height: 1.15;
  margin-top: 0;
}

h1 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: clamp(2rem,6vw,4.3rem);
  letter-spacing: -.045em;
  margin-bottom: 8px;
}

h2 {
  font-size: clamp(1.45rem,4vw,2.25rem);
  margin-bottom: 20px;
}

h3 {
  font-size: 1.15rem;
  margin: 28px 0 10px;
}

p { margin: 0 0 1.05em; }

.deck {
  font-size: 1.15rem;
  color: #465155;
  max-width: 650px;
}

.disclaimer {
  font-size: .86rem;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 15px;
  margin-top: 28px;
}

.timestamp {
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--strong);
  margin-bottom: 2px;
}

.location {
  font-size: .72rem;
  color: var(--muted);
  margin-bottom: 26px;
}

.character {
  display: inline-block;
  font-size: .68rem;
  font-weight: 800;
  color: var(--strong);
  border-bottom: 1px solid var(--line);
  padding-bottom: 3px;
  margin-bottom: 8px;
}

.character span {
  font-weight: 400;
  color: var(--muted);
}

.prompt {
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 800;
}

.choices {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}

.choice {
  width: 100%;
  text-align: left;
  border: 1px solid #aeb8b5;
  background: white;
  padding: 14px 16px;
  border-radius: 4px;
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.35;
  transition: .12s ease;
}

.choice:hover,
.choice:focus {
  border-color: var(--strong);
  transform: translateY(-1px);
  outline: none;
}

.choice b {
  display: inline-block;
  width: 26px;
}

.continue {
  display: inline-block;
  margin-top: 18px;
  border: 1px solid var(--strong);
  background: var(--strong);
  color: white;
  padding: 11px 17px;
  border-radius: 4px;
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 700;
}

.artifact {
  margin: 24px 0;
  padding: 18px;
  border: 1px solid var(--line);
  background: white;
  font-family: Arial, Helvetica, sans-serif;
}

.artifact-label {
  font-size: .66rem;
  color: var(--muted);
  font-weight: 800;
  margin-bottom: 12px;
}

.comments {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid #ddd;
  color: #4f585b;
  font-size: .9rem;
}

.diagram {
  text-align: center;
  font-family: "Courier New", monospace;
  white-space: pre-wrap;
  background: #f0f1ed;
  padding: 18px;
  border: 1px solid var(--line);
  margin: 20px 0;
}

.dx-panel {
  margin: 24px 0;
  padding: 18px;
  border: 1px solid var(--line);
  background: #f2f4f2;
  font-family: Arial, Helvetica, sans-serif;
}

.dx-panel h3 {
  margin: 0 0 8px;
  font-size: 1rem;
}

.dx-current {
  font-weight: 800;
  color: var(--strong);
}

.clue {
  margin: 20px 0;
  padding: 17px 18px;
  background: white;
  border: 1px solid var(--line);
  border-left: 4px solid var(--strong);
}

.clue h3 {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0 0 8px;
  font-size: 1rem;
}

.labgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px 18px;
  font-family: Arial, Helvetica, sans-serif;
  font-size: .92rem;
}

.labgrid div {
  border-bottom: 1px dotted #c8cfcd;
  padding: 5px 0;
}

.mystery-banner {
  margin: 25px 0;
  padding: 20px;
  border: 1px solid var(--strong);
  background: white;
  font-family: Arial, Helvetica, sans-serif;
}

.mystery-banner strong {
  display: block;
  font-size: 1.08rem;
  margin-bottom: 5px;
}

.small {
  font-size: .88rem;
  color: var(--muted);
}

.drawer {
  position: fixed;
  z-index: 40;
  right: 0;
  top: 0;
  height: 100%;
  width: min(430px,92vw);
  background: var(--paper);
  border-left: 1px solid var(--line);
  box-shadow: -15px 0 40px rgba(20,30,32,.15);
  padding: 22px;
  transform: translateX(105%);
  transition: .22s ease;
  overflow: auto;
}

.drawer.open { transform: none; }

.drawer-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}

.drawer-head h2 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 1.25rem;
  margin: 0;
}

.note-section { margin-top: 24px; }

.note-section h3 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: .72rem;
  letter-spacing: .11em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.note-section ul {
  margin: 0;
  padding-left: 20px;
}

.note-section li { margin-bottom: 8px; }

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.22);
  z-index: 30;
}

.hidden { display: none !important; }

.result {
  border-top: 5px solid var(--strong);
}

.result-kicker {
  font-size: .7rem;
  color: var(--muted);
  font-weight: 800;
}

.profile {
  margin: 24px 0;
  padding: 20px;
  background: white;
  border: 1px solid var(--line);
}

.profile h3 {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0 0 8px;
  font-size: 1.35rem;
}

.debrief {
  margin-top: 35px;
  padding-top: 25px;
  border-top: 1px solid var(--line);
}

.reset {
  border: 0;
  background: none;
  text-decoration: underline;
  color: var(--muted);
  padding: 0;
}

@media(max-width:600px) {
  .subbrand { display:none; }
  .wrap { margin-top:12px; padding:0 8px; }
  .card { padding:25px 20px; }
  .timestamp { font-size:1.45rem; }
  .labgrid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    THE PITT: EXPOSURE
    <span class="subbrand">AN INTERACTIVE EPISODE</span>
  </div>
  <button class="iconbtn" id="notesBtn">CASE NOTES</button>
</header>

<div id="scrim" class="scrim hidden"></div>

<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <h2>Case Notes</h2>
    <button class="iconbtn" id="closeNotes">CLOSE</button>
  </div>

  <p class="small">
    These notes reflect what is currently established, reported, or still uncertain in your version of the case.
  </p>

  <div class="note-section">
    <h3>Working diagnosis</h3>
    <div id="dxNote" class="dx-current">Not enough information yet</div>
  </div>

  <div class="note-section">
    <h3>Known</h3>
    <ul id="knownNotes"></ul>
  </div>

  <div class="note-section">
    <h3>Reported</h3>
    <ul id="reportedNotes"></ul>
  </div>

  <div class="note-section">
    <h3>Unconfirmed</h3>
    <ul id="unconfirmedNotes"></ul>
  </div>
</aside>

<main class="wrap">
  <section id="game" class="card"></section>
</main>

<script>
const frames = [
  "ORIGIN",
  "BOUNDARY",
  "AUTHORITY",
  "BLAME",
  "CARE",
  "WITNESS"
];

const state = {
  scores: Object.fromEntries(frames.map(x => [x,0])),
  choices: [],
  diagnosis: "Not enough information yet",
  dxHistory: [],
  finalPOV: null,

  notes: {
    known: [
      "Evan and Marcus are roommates.",
      "Both have fever, severe headache, and vomiting."
    ],
    reported: [],
    unconfirmed: [
      "The two illnesses have a common source."
    ]
  }
};

function addKnown(x) {
  if (!state.notes.known.includes(x)) state.notes.known.push(x);
}

function addReported(x) {
  if (!state.notes.reported.includes(x)) state.notes.reported.push(x);
}

function addUnconfirmed(x) {
  if (!state.notes.unconfirmed.includes(x)) state.notes.unconfirmed.push(x);
}

function removeUnconfirmed(x) {
  state.notes.unconfirmed =
    state.notes.unconfirmed.filter(n => n !== x);
}

const scenes = {

intro: {
  html: `
    <div class="eyebrow">
      Unofficial · Noncommercial · Classroom Exercise
    </div>

    <h1>THE PITT:<br>EXPOSURE</h1>

    <p class="deck">
      You are a medical student beginning a shift at Pittsburgh Trauma
      Medical Center. As the morning unfolds, you will decide what to
      investigate, whose perspective to follow, and what information
      deserves your attention.
    </p>

    <p>
      There are no “correct” choices. You will not see a score while
      you play. You may revise your diagnosis as new evidence appears.
    </p>

    <p class="disclaimer">
      This is an unofficial educational fanfiction inspired by
      <em>The Pitt</em>. All events and dialogue in this exercise are
      invented for classroom use.
    </p>
  `,
  next: "s1",
  button: "BEGIN SHIFT"
},

s1: {
  time: "7:14 A.M.",
  title: "Something Doesn't Fit",

  html: `
    <p>
      Forty-three minutes into your shift, you have already lost your
      pen, been corrected twice, and learned that the emergency
      department has at least six different meanings for the phrase
      <em>I'll be right back.</em> Your job is mostly to learn, help
      when someone asks, and stay out of the way when things get
      complicated.
    </p>

    <div class="character">
      DR. MICHAEL “ROBBY” ROBINAVITCH
      <span>· attending physician, running the ED shift</span>
    </div>

    <p>
      Across the department, Robby looks up from the tracking board
      and asks where Whitaker is. You point toward one of the treatment
      bays. Dr. Whitaker, one of the younger residents, is standing
      beside a stretcher with a college student named Evan Cole,
      twenty-two, who has a temperature of 103.1, severe headache,
      vomiting, and increasing confusion.
    </p>

    <p>
      Robby walks over, and you follow. Whitaker has barely started
      presenting the case when a nurse interrupts him. Another
      college-aged patient has just arrived with fever, vomiting,
      and a severe headache.
    </p>

    <p>“That's my roommate,” Evan manages to say.</p>

    <p>
      Whitaker looks at Robby. “Okay. That's interesting.”
    </p>

    <p>
      “It's two patients,” Robby says.
    </p>

    <p>
      “Two roommates with the same symptoms.”
    </p>

    <p>
      Robby turns to you. “Go find out what connects them.”
    </p>
  `,

  prompt: "What do you want to know first?",

  choices: [
    ["A",
     "What symptoms do they have in common?",
     {AUTHORITY:1},
     "s2"],

    ["B",
     "Where have they both been recently?",
     {BOUNDARY:1},
     "s2"],

    ["C",
     "Which one became sick first?",
     {ORIGIN:1},
     "s2"]
  ]
},

s2: {
  time: "7:32 A.M.",
  title: "Two Patients",

  html: `
    <p>
      You get pieces rather than an explanation. Evan started feeling
      sick late last night. His roommate, Marcus, says he felt “off”
      sometime yesterday afternoon but didn't think much of it. Both
      went to the same off-campus party Friday night, but so did a few
      hundred other people. Both ate at the same dining hall last week,
      along with several thousand students. And, obviously, they share
      an apartment.
    </p>

    <p>
      When you report this to Robby, he listens without interrupting.
    </p>

    <p>“So what do they have?” you ask.</p>

    <p>
      “I don't know.” When you keep waiting, he adds, “There isn't a
      prize for diagnosing it before we have enough information.
      Keep going.”
    </p>

    <p>
      Marcus, who has been listening with his eyes closed, speaks from
      the bed. “Evan works at the airport.”
    </p>

    <p>
      Whitaker looks over. “At the airport?”
    </p>

    <p>“Weekends.”</p>
  `,

  next: "s3",
  button: "KEEP GOING",

  onEnter() {
    addKnown("Both attended the same off-campus party Friday.");
    addReported("Evan works weekends at Pittsburgh International Airport.");
  }
},

s3: {
  time: "7:46 A.M.",
  title: "The Airport",

  html: `
    <p>
      Evan works Saturdays and Sundays assisting passengers at
      Pittsburgh International Airport. Thousands of people move
      through his terminal, and yesterday he worked most of his shift
      despite developing what he thought was a mild headache. He
      eventually went home early.
    </p>

    <div class="character">
      DANA EVANS
      <span>· charge nurse, keeps the department functioning</span>
    </div>

    <p>
      Dana appears beside you while you're explaining this. If Robby
      seems to know every medical problem in the department, Dana seems
      to know everything else.
    </p>

    <p>“What've we got?”</p>

    <p>
      “Two roommates. Fever, headache, vomiting, confusion. One works
      at the airport.”
    </p>

    <p>
      Dana looks at you for a moment. “You said that last part like it
      means something.”
    </p>

    <p>You realize you did.</p>
  `,

  prompt: "What about the airport detail seems most important?",

  choices: [
    ["A",
     "Evan comes into contact with travelers from all over the world.",
     {BOUNDARY:2},
     "s4"],

    ["B",
     "Evan kept working after he started feeling sick.",
     {BLAME:2},
     "s4"],

    ["C",
     "We don't know whether the airport has anything to do with this. Do their clinical presentations actually match?",
     {AUTHORITY:2},
     "s4"],

    ["D",
     "Marcus doesn't work at the airport. What does his timeline look like?",
     {ORIGIN:1,WITNESS:1},
     "s4"]
  ]
},

s4: {
  time: "8:21 A.M.",
  title: "Three",

  html: `
    <p>
      The third patient arrives less than forty minutes later. Nia
      Brooks is twenty-one, with a higher fever, vomiting, and severe
      sensitivity to the fluorescent lights. When a nurse asks whether
      she knows Evan or Marcus, she recognizes Evan's name and says she
      saw him at a party Friday.
    </p>

    <p>
      The same party.
    </p>

    <p>
      Someone pulls the curtain and someone else starts making calls.
      Nobody on the team says <em>outbreak</em>, but a few minutes
      later you hear a patient's mother use the word in the waiting
      area. Her daughter asks who told her. “I heard someone,” she says.
    </p>

    <p>
      Dana passes you carrying a stack of supplies. “Don't stand there
      looking fascinated. Be useful.”
    </p>
  `,

  prompt: "Where do you go?",

  choices: [
    ["A",
     "Stay with Nia. She's frightened, sick, and alone.",
     {CARE:2,WITNESS:1},
     "nia"],

    ["B",
     "Find Robby. You want to know what he thinks is happening.",
     {AUTHORITY:2},
     "robby"],

    ["C",
     "Listen to what's happening in the waiting room.",
     {WITNESS:2},
     "waiting"]
  ],

  onEnter() {
    addKnown("Nia attended the same Friday party.");
    addUnconfirmed("The Friday party is the common exposure.");
  }
},

nia: {
  time: "8:36 A.M.",
  title: "Nia",

  html: `
    <p>
      Nia asks whether she's going to die. You tell her the team is
      taking care of her, which sounds inadequate even while you're
      saying it.
    </p>

    <p>
      “My mom's driving here,” she says. “Don't tell her it's meningitis
      or anything. She'll lose it.”
    </p>

    <p>
      Nobody has said meningitis. You tell her you don't know yet.
    </p>

    <p>“That's worse,” she says, and closes her eyes.</p>
  `,

  next: "dx1",
  button: "RETURN TO THE DEPARTMENT"
},

robby: {
  time: "8:36 A.M.",
  title: "Robby",

  html: `
    <p>
      You find Robby studying the tracking board and ask whether this
      is an outbreak.
    </p>

    <p>“Maybe.”</p>

    <p>“What do you think it is?”</p>

    <p>“I think we have three sick people.”</p>

    <p>
      You point out that they're connected. Robby agrees that they
      probably are, then stops you as you try to turn that into a
      diagnosis. “You're trying to get to the end of the story before
      we have the middle.”
    </p>
  `,

  next: "dx1",
  button: "KEEP GOING"
},

waiting: {
  time: "8:36 A.M.",
  title: "The Waiting Room",

  html: `
    <p>
      In the waiting room, the story is already changing. Three
      patients have become five. The airport has become “some flight.”
      Someone says all the sick students ate at the same restaurant,
      and someone else says the hospital has locked down an entire
      section.
    </p>

    <p>
      None of that is true, at least not as stated. But everyone telling
      it seems to believe some version of it.
    </p>
  `,

  next: "dx1",
  button: "RETURN TO THE DEPARTMENT"
},

dx1: {
  time: "8:42 A.M.",
  title: "Working Diagnosis",

  html: `
    <p>
      You have three young adults with fever, severe headache,
      vomiting, and varying degrees of confusion. They know one
      another, but at this point you still do not know whether you are
      looking at one illness or several.
    </p>

    <div class="dx-panel">
      <h3>YOUR WORKING THEORY</h3>
      <p>
        Choose the explanation you would keep highest on your
        differential right now. You can revise it later.
      </p>
    </div>
  `,

  prompt: "What is your working diagnosis?",

  choices: [
    ["A","Foodborne illness / gastroenteritis",{},"s5","dx-food"],
    ["B","Influenza, COVID, or another viral infection",{},"s5","dx-viral"],
    ["C","Meningitis or another infection involving the central nervous system",{},"s5","dx-meningitis"],
    ["D","Toxic or environmental exposure",{},"s5","dx-toxic"],
    ["E","Not enough information yet",{},"s5","dx-unknown"]
  ]
},

s5: {
  time: "8:53 A.M.",
  title: "The Traveler",

  html: `
    <p>
      Whitaker finds you with a new detail. On Sunday afternoon, Evan
      helped a passenger near baggage claim who had collapsed. The
      passenger was vomiting, disoriented, and barely able to stand.
      Evan stayed with him until paramedics arrived.
    </p>

    <p>“Do we know what happened to him?” you ask.</p>

    <p>“Not yet.”</p>

    <p>
      Someone nearby repeats the new information: “Evan was exposed to
      a sick traveler?”
    </p>

    <p>
      The phrasing catches on quickly. A sick traveler, an airport
      worker, a college party, and three sick students now form a
      plausible sequence, even though several parts of it are still
      unknown.
    </p>
  `,

  prompt: "What do you most want to know?",

  choices: [
    ["A",
     "Where had the traveler come from?",
     {ORIGIN:2,BOUNDARY:1},
     "investigate"],

    ["B",
     "Can we find the traveler and determine whether he's sick with the same thing?",
     {ORIGIN:1,AUTHORITY:1},
     "investigate"],

    ["C",
     "How much actual contact did Evan have with him?",
     {BOUNDARY:2},
     "investigate"],

    ["D",
     "Why are we assuming the traveler matters?",
     {AUTHORITY:1,WITNESS:1},
     "investigate"]
  ],

  onEnter() {
    addReported(
      "On Sunday, Evan assisted a vomiting, disoriented traveler at the airport."
    );
    addUnconfirmed("The sick traveler infected Evan.");
  }
},

investigate: {
  time: "9:07 A.M.",
  title: "One More Thing",

  html: `
    <p>
      Robby wants you back in a few minutes. Before you go, you have
      time to follow up on one part of the case. You will not have time
      to check everything.
    </p>

    <div class="artifact">
      <div class="artifact-label">INVESTIGATION</div>
      <strong>Choose one source of additional information.</strong>
    </div>
  `,

  prompt: "What do you check?",

  choices: [
    ["A","The first round of laboratory results.",{},"labs"],
    ["B","Talk to Nia again about when her symptoms began.",{},"interview"],
    ["C","Build a timeline of the students' last 72 hours.",{},"timeline"],
    ["D","Take a closer exposure history from Evan.",{},"exposure"]
  ]
},

labs: {
  time: "9:12 A.M.",
  title: "Laboratory Results",

  html: `
    <div class="clue">
      <h3>What you find</h3>

      <div class="labgrid">
        <div><strong>WBC</strong> 18.6 K/µL ↑</div>
        <div><strong>Neutrophils</strong> elevated</div>
        <div><strong>Lactate</strong> 3.1 mmol/L ↑</div>
        <div><strong>Platelets</strong> mildly low</div>
      </div>

const drawer = document.getElementById("drawer");
const scrim = document.getElementById("scrim");

document.getElementById("notesBtn").onclick = openNotes;
document.getElementById("closeNotes").onclick = closeNotes;
scrim.onclick = closeNotes;

function updateNotes() {
  fillList("knownNotes", state.notes.known);
  fillList("reportedNotes", state.notes.reported);
  fillList("unconfirmedNotes", state.notes.unconfirmed);

  document.getElementById("dxNote").textContent =
    state.diagnosis;
}

function fillList(id, items) {
  document.getElementById(id).innerHTML =
    items.length
      ? items.map(x => `<li>${x}</li>`).join("")
      : `<li class="small">None recorded.</li>`;
}

function openNotes() {
  updateNotes();
  drawer.classList.add("open");
  scrim.classList.remove("hidden");
}

function closeNotes() {
  drawer.classList.remove("open");
  scrim.classList.add("hidden");
}

function record(text, scores, key) {

  Object.entries(scores || {}).forEach(([name,value]) => {
    state.scores[name] += value;
  });

  const dxMap = {
    "dx-food": "Foodborne illness / gastroenteritis",
    "dx-viral": "Influenza, COVID, or another viral infection",
    "dx-meningitis": "Meningitis / CNS infection",
    "dx-toxic": "Toxic or environmental exposure",
    "dx-unknown": "Not enough information yet",

    "dx2-food": "Foodborne illness / gastroenteritis",
    "dx2-viral": "Influenza, COVID, or another viral infection",
    "dx2-meningitis": "Meningitis / meningococcal disease",
    "dx2-toxic": "Toxic or environmental exposure",
    "dx2-unknown": "Not enough information yet"
  };

  if (dxMap[key]) {
    state.diagnosis = dxMap[key];

    state.dxHistory.push({
      diagnosis: state.diagnosis
    });
  }

  if (key && key.startsWith("pov-")) {
    state.finalPOV = key.replace("pov-","");
  }

  state.choices.push(text);
}

function render(id) {

  closeNotes();

  if (id === "results") {
    renderResults();
    return;
  }

  const scene = scenes[id];

  if (scene.onEnter) scene.onEnter();

  const game = document.getElementById("game");

  let html = "";

  if (scene.time) {
    html += `
      <div class="timestamp">${scene.time}</div>
      <div class="location">
        PITTSBURGH TRAUMA MEDICAL CENTER · EMERGENCY DEPARTMENT
      </div>
    `;
  }

  if (scene.title) {
    html += `<h2>${scene.title}</h2>`;
  }

  html += scene.html || "";

  if (scene.prompt) {

    html += `
      <div class="prompt">${scene.prompt}</div>
      <div class="choices">
    `;

    scene.choices.forEach((choice,index) => {
      html += `
        <button class="choice" data-index="${index}">
          <b>${choice[0]}</b>${choice[1]}
        </button>
      `;
    });

    html += `</div>`;

  } else if (scene.next) {

    html += `
      <button class="continue" id="continueBtn">
        ${scene.button || "CONTINUE"}
      </button>
    `;
  }

  game.innerHTML = html;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  if (scene.prompt) {

    game.querySelectorAll(".choice").forEach(button => {

      button.onclick = () => {

        const choice =
          scene.choices[Number(button.dataset.index)];

        record(
          choice[1],
          choice[2],
          choice[4]
        );

        render(choice[3]);
      };
    });

  } else if (scene.next) {

    document.getElementById("continueBtn").onclick =
      () => render(scene.next);
  }
}

function diagnosisResult() {

  const history = state.dxHistory;

  if (!history.length) {
    return "You did not record a working diagnosis.";
  }

  const first = history[0].diagnosis;
  const last = history[history.length - 1].diagnosis;

  const gotMeningitis =
    last.includes("Meningitis");

  if (
    gotMeningitis &&
    first.includes("Meningitis")
  ) {
    return `
      You suspected <strong>${first}</strong> early and kept
      that diagnosis as the clinical evidence accumulated.
    `;
  }

  if (gotMeningitis) {
    return `
      You began with <strong>${first}</strong> and revised your
      working diagnosis to <strong>${last}</strong> as new
      evidence appeared.
    `;
  }

  return `
    Your final working theory was <strong>${last}</strong>.
    The subsequent CSF findings and clinical pattern shifted
    the team's leading diagnosis toward meningococcal disease.
  `;
}

function renderResults() {

  const ranked =
    Object.entries(state.scores)
      .sort((a,b) => b[1] - a[1]);

  const primary =
    descriptions[ranked[0][0]];

  const secondary =
    descriptions[ranked[1][0]];

  const game =
    document.getElementById("game");

  game.className = "card result";

  game.innerHTML = `

    <div class="result-kicker">
      SHIFT COMPLETE
    </div>

    <h1>Your Version of the Outbreak</h1>

    <p>
      Throughout the episode, you made decisions about what counted
      as a clue, whose knowledge you sought, where you located danger,
      and whose experience you followed. Those decisions shaped the
      story you encountered.

    <div class="profile">

      </div>

      <h3>${secondary.title}</h3>

      <p>${secondary.body}</p>
    </div>

    <h3>The diagnostic mystery</h3>

    <p>${diagnosisResult()}</p>

    <p>
      The episode separated two questions that can easily collapse
      into one another:
      <strong>What disease is this?</strong>
      and
      <strong>What story explains how it got here?</strong>
      The first became increasingly answerable. The second remained
      much less certain.
    </p>

    <h3>Where your episode ended</h3>

    <p>
      You chose to spend the final minutes with
      <strong>${state.finalPOV || "someone in the department"}</strong>.
      That choice does not change the outbreak itself, but it changes
      whose experience supplies the ending.
    </p>

    <h3>Look again at 10:04 A.M.</h3>

    <p>
      The episode offered a coherent explanation in which Evan
      connected the airport, the apartment, the party, and the other
      cases. The explanation had a beginning, a carrier, a direction,
      and a person at its center. It was also unsupported by the
      timeline.
    </p>

    <p>
      You did not construct that explanation alone. The interface
      selected which facts appeared, when they appeared, whose accounts
      were available, and which actions you could choose. You chose a
      path through information that had already been organized for you.
    </p>

    <details>
      <summary>
        <strong>Review the choices you made</strong>
      </summary>

      <ol>
        ${state.choices.map(x => `<li>${x}</li>`).join("")}
      </ol>
    </details>

    <div class="debrief">

      <div class="result-kicker">
        ONE MORE CONTAGION STORY
      </div>

      <h2>
        Return to Whit Taylor's
        <em>Together, But Mostly Apart</em>.
      </h2>

      <p>
        This interactive episode organized contagion around
        accumulating cases, evidence, causal explanation, medical
        authority, and decisions about what should happen next.
      </p>

      <p>
        <strong>
          What does Taylor's comic refuse from the contagion story
          you just experienced?
        </strong>
      </p>

      <p>
        <strong>
          What does she put at the center instead?
        </strong>
      </p>

      <p>
        Then return to the question from the narrative unit:
        <strong>
          What can a comic make visible about living through contagion
          that this interactive episode could not?
        </strong>
      </p>

    </div>

    <p class="disclaimer">
      For classroom discussion only. This fictional scenario is
      designed to explore narrative framing, not to teach clinical
      decision-making.

      <button class="reset" id="resetBtn">
        Restart the episode
      </button>
    </p>
  `;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  document.getElementById("resetBtn").onclick =
    () => location.reload();
}

render("intro");
