<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pitt: Exposure</title>

<style>
:root{
  --bg:#e9eceb;
  --paper:#f7f7f3;
  --ink:#1e2528;
  --muted:#667176;
  --line:#c8cfcd;
  --strong:#26383d;
  --gold:#8a6a25;
  --green:#315c48;
  --red:#7a3d36;
  --shadow:0 14px 45px rgba(22,31,34,.12);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  line-height:1.62;
}

button{cursor:pointer}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:11px 18px;
  background:rgba(247,247,243,.97);
  border-bottom:1px solid var(--line);
  font-family:Arial,Helvetica,sans-serif;
}

.brand{
  font-weight:800;
  letter-spacing:.08em;
  font-size:.86rem;
}

.subbrand{
  font-weight:400;
  color:var(--muted);
  margin-left:8px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.scorebox{
  border:1px solid var(--line);
  background:#fff;
  padding:7px 11px;
  border-radius:4px;
  font-size:.78rem;
  font-weight:800;
  white-space:nowrap;
}

#score{
  color:var(--gold);
  font-size:1rem;
}

.iconbtn{
  border:1px solid var(--line);
  background:white;
  color:var(--strong);
  padding:7px 10px;
  border-radius:4px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:.82rem;
  font-weight:700;
}

.wrap{
  max-width:900px;
  margin:28px auto 80px;
  padding:0 18px;
}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:clamp(25px,5vw,58px);
}

.eyebrow,
.timestamp,
.location,
.character,
.artifact-label,
.result-kicker{
  font-family:Arial,Helvetica,sans-serif;
  text-transform:uppercase;
  letter-spacing:.11em;
}

.eyebrow{
  font-size:.73rem;
  color:var(--muted);
  font-weight:700;
}

h1,h2,h3{
  line-height:1.15;
  margin-top:0;
}

h1{
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(2rem,6vw,4.3rem);
  letter-spacing:-.045em;
  margin-bottom:8px;
}

h2{
  font-size:clamp(1.45rem,4vw,2.25rem);
  margin-bottom:20px;
}

h3{
  font-size:1.15rem;
  margin:28px 0 10px;
}

p{
  margin:0 0 1.05em;
}

.deck{
  font-size:1.15rem;
  color:#465155;
  max-width:650px;
}

.disclaimer{
  font-size:.86rem;
  color:var(--muted);
  border-top:1px solid var(--line);
  padding-top:15px;
  margin-top:28px;
}

.timestamp{
  font-size:1.75rem;
  font-weight:800;
  color:var(--strong);
  margin-bottom:2px;
}

.location{
  font-size:.72rem;
  color:var(--muted);
  margin-bottom:26px;
}

.character{
  display:inline-block;
  font-size:.68rem;
  font-weight:800;
  color:var(--strong);
  border-bottom:1px solid var(--line);
  padding-bottom:3px;
  margin-bottom:8px;
}

.character span{
  font-weight:400;
  color:var(--muted);
}

.prompt{
  margin-top:30px;
  padding-top:20px;
  border-top:1px solid var(--line);
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800;
}

.choices{
  display:grid;
  gap:10px;
  margin-top:14px;
}

.choice{
  width:100%;
  text-align:left;
  border:1px solid #aeb8b5;
  background:white;
  padding:14px 16px;
  border-radius:4px;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.35;
  transition:.12s ease;
}

.choice:hover,
.choice:focus{
  border-color:var(--strong);
  transform:translateY(-1px);
  outline:none;
}

.choice b{
  display:inline-block;
  width:26px;
}

.continue{
  display:inline-block;
  margin-top:18px;
  border:1px solid var(--strong);
  background:var(--strong);
  color:white;
  padding:11px 17px;
  border-radius:4px;
  font-family:Arial,Helvetica,sans-serif;
  font-weight:700;
}

.artifact{
  margin:24px 0;
  padding:18px;
  border:1px solid var(--line);
  background:white;
  font-family:Arial,Helvetica,sans-serif;
}

.artifact-label{
  font-size:.66rem;
  color:var(--muted);
  font-weight:800;
  margin-bottom:12px;
}

.clinical-clue{
  margin:22px 0;
  padding:17px 19px;
  background:#fff;
  border:1px solid var(--line);
  border-left:5px solid var(--green);
}

.clinical-clue h3{
  font-family:Arial,Helvetica,sans-serif;
  font-size:.76rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--green);
  margin:0 0 8px;
}

.clinical-clue p:last-child{
  margin-bottom:0;
}

.clue{
  margin:20px 0;
  padding:17px 18px;
  background:white;
  border:1px solid var(--line);
  border-left:4px solid var(--strong);
}

.clue h3{
  font-family:Arial,Helvetica,sans-serif;
  margin:0 0 8px;
  font-size:1rem;
}

.diagram{
  text-align:center;
  font-family:"Courier New",monospace;
  white-space:pre-wrap;
  background:#f0f1ed;
  padding:18px;
  border:1px solid var(--line);
  margin:20px 0;
}

.dx-panel{
  margin:24px 0;
  padding:18px;
  border:1px solid var(--line);
  background:#f2f4f2;
  font-family:Arial,Helvetica,sans-serif;
}

.dx-panel h3{
  margin:0 0 8px;
  font-size:1rem;
}

.labgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px 18px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:.92rem;
}

.labgrid div{
  border-bottom:1px dotted #c8cfcd;
  padding:5px 0;
}

.mystery-banner{
  margin:25px 0;
  padding:20px;
  border:1px solid var(--strong);
  background:white;
  font-family:Arial,Helvetica,sans-serif;
}

.mystery-banner strong{
  display:block;
  font-size:1.08rem;
  margin-bottom:5px;
}

.score-flash{
  margin:20px 0;
  padding:14px 17px;
  border:1px solid #b9aa7d;
  background:#fbf7e8;
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800;
  color:#624c18;
}

.score-flash.big{
  font-size:1.08rem;
}

.small{
  font-size:.88rem;
  color:var(--muted);
}

.network{
  margin:25px 0;
  background:white;
  border:1px solid var(--line);
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
}

.person{
  padding:12px 14px;
  margin:8px 0;
  border:1px solid var(--line);
  background:#fafafa;
}

.person strong{
  display:block;
  margin-bottom:5px;
}

.tag{
  display:inline-block;
  margin-top:6px;
  margin-right:5px;
  padding:2px 7px;
  border:1px solid var(--line);
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.drawer{
  position:fixed;
  z-index:40;
  right:0;
  top:0;
  height:100%;
  width:min(430px,92vw);
  background:var(--paper);
  border-left:1px solid var(--line);
  box-shadow:-15px 0 40px rgba(20,30,32,.15);
  padding:22px;
  transform:translateX(105%);
  transition:.22s ease;
  overflow:auto;
}

.drawer.open{
  transform:none;
}

.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
}

.drawer-head h2{
  font-family:Arial,Helvetica,sans-serif;
  font-size:1.25rem;
  margin:0;
}

.note-section{
  margin-top:24px;
}

.note-section h3{
  font-family:Arial,Helvetica,sans-serif;
  font-size:.72rem;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
}

.note-section ul{
  margin:0;
  padding-left:20px;
}

.note-section li{
  margin-bottom:8px;
}

.scrim{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.22);
  z-index:30;
}

.hidden{
  display:none!important;
}

.result{
  border-top:5px solid var(--strong);
}

.result-kicker{
  font-size:.7rem;
  color:var(--muted);
  font-weight:800;
}

.final-score{
  text-align:center;
  margin:30px 0;
  padding:28px;
  background:#fff;
  border:2px solid var(--strong);
}

.final-score .number{
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(3rem,10vw,6rem);
  line-height:1;
  font-weight:900;
  color:var(--gold);
}

.final-score .outof{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--muted);
  font-weight:700;
}

.rank{
  font-family:Arial,Helvetica,sans-serif;
  font-size:1.35rem;
  font-weight:900;
  margin-top:14px;
}

.case-status{
  margin:28px 0;
  border:1px solid var(--line);
  background:white;
}

.case-row{
  display:grid;
  grid-template-columns:170px 1fr;
  border-bottom:1px solid var(--line);
}

.case-row:last-child{
  border-bottom:0;
}

.case-row strong,
.case-row span{
  padding:10px 13px;
}

.case-row strong{
  font-family:Arial,Helvetica,sans-serif;
  font-size:.76rem;
  letter-spacing:.07em;
  text-transform:uppercase;
  background:#f0f1ed;
}

.profile{
  margin:24px 0;
  padding:20px;
  background:white;
  border:1px solid var(--line);
}

.profile h3{
  font-family:Arial,Helvetica,sans-serif;
  margin:0 0 8px;
  font-size:1.35rem;
}

.reset{
  border:0;
  background:none;
  text-decoration:underline;
  color:var(--muted);
  padding:0;
}

@media(max-width:600px){
  .subbrand{display:none}
  .wrap{margin-top:12px;padding:0 8px}
  .card{padding:25px 20px}
  .timestamp{font-size:1.45rem}
  .labgrid{grid-template-columns:1fr}
  .scorebox{font-size:.68rem}
  .case-row{grid-template-columns:120px 1fr}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    THE PITT: EXPOSURE
    <span class="subbrand">AN INTERACTIVE EPISODE</span>
  </div>

  <div class="top-actions">
    <div class="scorebox">
      DETECTIVE SCORE:
      <span id="score">0</span>/50
    </div>

    <button class="iconbtn" id="notesBtn">
      CASE NOTES
    </button>
  </div>
</header>

<div id="scrim" class="scrim hidden"></div>

<aside id="drawer" class="drawer">

  <div class="drawer-head">
    <h2>Case Notes</h2>
    <button class="iconbtn" id="closeNotes">
      CLOSE
    </button>
  </div>

  <p class="small">
    Your notes separate established information from reports and
    hypotheses.
  </p>

  <div class="note-section">
    <h3>Working diagnosis</h3>
    <div id="dxNote">
      <strong>Not enough information yet</strong>
    </div>
  </div>

  <div class="note-section">
    <h3>Known</h3>
    <ul id="knownNotes"></ul>
  </div>

  <div class="note-section">
    <h3>Reported / suspected</h3>
    <ul id="reportedNotes"></ul>
  </div>

  <div class="note-section">
    <h3>Unconfirmed</h3>
    <ul id="unconfirmedNotes"></ul>
  </div>

</aside>

<main class="wrap">
  <section id="game" class="card"></section>
</main>

<script>

const frames = [
  "ORIGIN",
  "BOUNDARY",
  "AUTHORITY",
  "BLAME",
  "CARE",
  "WITNESS"
];

const state = {

  detectiveScore:0,

  scored:new Set(),

  scores:Object.fromEntries(
    frames.map(x => [x,0])
  ),

  choices:[],

  diagnosis:"Not enough information yet",

  dxHistory:[],

  finalPOV:null,

  notes:{
    known:[
      "Evan and Marcus are roommates.",
      "Both have fever, severe headache, and vomiting."
    ],

    reported:[],

    unconfirmed:[
      "The illnesses have a common source."
    ]
  }
};

function award(points,id){

  if(state.scored.has(id)){
    return;
  }

  state.scored.add(id);

  state.detectiveScore += points;

  document.getElementById("score").textContent =
    state.detectiveScore;
}

function addKnown(text){

  if(!state.notes.known.includes(text)){
    state.notes.known.push(text);
  }
}

function addReported(text){

  if(!state.notes.reported.includes(text)){
    state.notes.reported.push(text);
  }
}

function addUnconfirmed(text){

  if(!state.notes.unconfirmed.includes(text)){
    state.notes.unconfirmed.push(text);
  }
}

function removeUnconfirmed(text){

  state.notes.unconfirmed =
    state.notes.unconfirmed.filter(
      item => item !== text
    );
}


/* =========================================================
   SCENES
   ========================================================= */

const scenes = {


/* ---------- INTRO ---------- */

intro:{

  html:`

    <div class="eyebrow">
      Unofficial · Noncommercial · Classroom Exercise
    </div>

    <h1>
      THE PITT:<br>
      EXPOSURE
    </h1>

    <p class="deck">
      You are a medical student beginning a shift at Pittsburgh
      Trauma Medical Center. Several patients are about to arrive
      with a connection nobody understands yet.
    </p>

    <p>
      Follow the clues, make a working diagnosis, and investigate
      the outbreak. You can earn up to
      <strong>50 Detective Points</strong>.
    </p>

    <p>
      You do <strong>not</strong> need medical knowledge to solve
      the case. When a medical detail matters, the game will give
      you the information you need.
    </p>

    <p class="disclaimer">
      This is an unofficial educational fanfiction inspired by
      <em>The Pitt</em>. The scenario and dialogue are invented
      for classroom use.
    </p>
  `,

  next:"s1",

  button:"BEGIN SHIFT"
},


/* ---------- FIRST TWO PATIENTS ---------- */

s1:{

  time:"7:14 A.M.",

  title:"Something Doesn't Fit",

  html:`

    <p>
      Forty-three minutes into your shift, you have already lost
      your pen, been corrected twice, and learned that the emergency
      department has at least six meanings for the phrase
      <em>I'll be right back.</em>
    </p>

    <div class="character">
      DR. MICHAEL “ROBBY” ROBINAVITCH
      <span>· attending physician, running the ED shift</span>
    </div>

    <p>
      Dr. Whitaker, one of the younger residents, is standing beside
      Evan Cole, twenty-two. Evan has a temperature of 103.1, a
      severe headache, vomiting, and increasing confusion.
    </p>

    <p>
      Whitaker has barely started presenting the case when a nurse
      interrupts him. Another college-aged patient has just arrived
      with fever, vomiting, and a severe headache.
    </p>

    <p>
      “That's my roommate,” Evan manages to say.
    </p>

    <p>
      Whitaker looks at Robby. “Okay. That's interesting.”
    </p>

    <p>
      “It's two patients,” Robby says.
    </p>

    <p>
      “Two roommates with the same symptoms.”
    </p>

    <p>
      Robby turns to you. “Go find out what connects them.”
    </p>
  `,

  prompt:"What do you want to know first?",

  choices:[

    [
      "A",
      "What symptoms do they have in common?",
      {AUTHORITY:1},
      "s2"
    ],

    [
      "B",
      "Where have they both been recently?",
      {BOUNDARY:1},
      "s2"
    ],

    [
      "C",
      "Which one became sick first?",
      {ORIGIN:1},
      "s2"
    ]
  ]
},


s2:{

  time:"7:32 A.M.",

  title:"Two Patients",

  html:`

    <p>
      You get pieces rather than an explanation. Evan started feeling
      sick late last night. His roommate, Marcus, says he felt “off”
      sometime yesterday afternoon but didn't think much of it.
    </p>

    <p>
      Both went to the same off-campus party Friday night, but so did
      a few hundred other people. Both ate at the same dining hall
      last week, along with several thousand students. And, obviously,
      they share an apartment.
    </p>

    <div class="clinical-clue">

      <h3>Clinical clue #1</h3>

      <p>
        Fever, vomiting, and headache can occur with many illnesses.
        But <strong>severe headache plus confusion</strong> makes
        the team more concerned about an infection affecting the
        brain or the tissues surrounding it.
      </p>

    </div>

    <p>
      Marcus, who has been listening with his eyes closed, speaks
      from the bed.
    </p>

    <p>
      “Evan works at the airport.”
    </p>

    <p>
      Whitaker looks over. “At the airport?”
    </p>

  `,

  next:"s3",

  button:"KEEP GOING",

  onEnter(){

    addKnown(
      "Evan and Marcus attended the same off-campus party Friday."
    );

    addReported(
      "Evan works weekends at Pittsburgh International Airport."
    );
  }
},


/* ---------- AIRPORT ---------- */

s3:{

  time:"7:46 A.M.",

  title:"The Airport",

  html:`

    <p>
      Evan works Saturdays and Sundays assisting passengers at
      Pittsburgh International Airport. Thousands of people move
      through his terminal.
    </p>

    <div class="character">
      DANA EVANS
      <span>· charge nurse, keeps the department functioning</span>
    </div>

    <p>
      Dana appears beside you while you're explaining this.
    </p>

    <p>
      “What've we got?”
    </p>

    <p>
      “Two roommates. Fever, headache, vomiting, confusion. One
      works at the airport.”
    </p>

    <p>
      Dana looks at you. “You said that last part like it means
      something.”
    </p>

    <p>
      You realize you did.
    </p>
  `,

  prompt:"Which response is the best detective move?",

  choices:[

    [
      "A",
      "Focus on the airport. Thousands of travelers pass through it.",
      {BOUNDARY:2},
      "s4"
    ],

    [
      "B",
      "Ask whether Evan worked while sick. That might explain transmission.",
      {BLAME:2},
      "s4"
    ],

    [
      "C",
      "Keep the airport in mind, but don't treat it as evidence until something actually connects it to the illness.",
      {AUTHORITY:2},
      "s4",
      "hypothesis-not-fact"
    ]
  ]
},


/* ---------- NIA + CALEB INTRODUCTION ---------- */

s4:{

  time:"8:21 A.M.",

  title:"Three",

  html:`

    <p>
      The third patient is Nia Brooks, twenty-one, with a higher
      fever, vomiting, and a severe headache. She keeps turning her
      face away from the fluorescent lights.
    </p>

    <p>
      Her friend Caleb brought her to the hospital. He is sitting
      outside the treatment area with Nia's backpack at his feet,
      answering questions for the registration clerk whenever Nia
      cannot.
    </p>

    <p>
      When a nurse asks whether Nia knows Evan or Marcus, Caleb
      answers before she does.
    </p>

    <p>
      “Yeah. We were all at the same party Friday.”
    </p>

    <p>
      Nia opens her eyes long enough to nod.
    </p>

    <div class="clinical-clue">

      <h3>Clinical clue #2</h3>

      <p>
        Extreme sensitivity to light is called
        <strong>photophobia</strong>. Severe headache + fever +
        photophobia can occur with <strong>meningitis</strong>,
        an inflammation of the protective tissues surrounding
        the brain and spinal cord.
      </p>

    </div>

    <p>
      Nobody has diagnosed Nia yet. But meningitis has now entered
      your list of possibilities.
    </p>
  `,

  prompt:"You have a few minutes. What do you investigate?",

  choices:[

    [
      "A",
      "Ask Nia and Caleb exactly when her symptoms started.",
      {AUTHORITY:1,CARE:1},
      "niaTimeline",
      "investigation"
    ],

    [
      "B",
      "Ask Robby what diagnoses he is considering.",
      {AUTHORITY:2},
      "robbyDifferential",
      "investigation"
    ],

    [
      "C",
      "Listen to what people in the waiting room are saying.",
      {WITNESS:2},
      "waitingRoom",
      "investigation"
    ]
  ],

  onEnter(){

    addKnown(
      "Nia attended the same Friday party."
    );

    addKnown(
      "Nia has fever, severe headache, vomiting, and photophobia."
    );

    addReported(
      "Caleb, Nia's friend, was also at the Friday party."
    );

    addUnconfirmed(
      "The Friday party is the common exposure."
    );
  }
},


niaTimeline:{

  time:"8:34 A.M.",

  title:"Nia's Timeline",

  html:`

    <p>
      You ask Nia when the headache began. She thinks for a moment.
    </p>

    <p>
      “Saturday night. I was at work. I thought I was dehydrated.”
    </p>

    <p>
      Caleb confirms that she texted him from work that evening.
      By Sunday morning, the light hurt her eyes and she had started
      vomiting.
    </p>

    <p>
      You write <strong>SATURDAY NIGHT</strong> in your notes.
    </p>

    <div class="score-flash">
      +5 DETECTIVE POINTS — You investigated a useful part of the case.
    </div>
  `,

  next:"dx1",

  button:"MAKE A WORKING DIAGNOSIS",

  onEnter(){

    award(5,"investigation");

    addKnown(
      "Nia's severe headache began Saturday night."
    );
  }
},


robbyDifferential:{

  time:"8:34 A.M.",

  title:"Robby's Differential",

  html:`

    <p>
      You ask Robby what diagnoses he is considering.
    </p>

    <p>
      “Could be viral. Could be bacterial. Could be an exposure.
      Meningitis is on the list now because of the headache,
      confusion, and photophobia.”

/* =========================================================
   NARRATIVE FRAME DESCRIPTIONS
   ========================================================= */

const descriptions = {

  ORIGIN:{
    title:"ORIGIN",
    body:
      "You repeatedly looked for beginnings, timelines, and causal chains. You wanted to know where the outbreak started and how one case led to another."
  },

  BOUNDARY:{
    title:"BOUNDARY",
    body:
      "You repeatedly focused on exposure, movement, locations, and containment: where danger was located and how it might move between people and places."
  },

  AUTHORITY:{
    title:"EVIDENCE",
    body:
      "You repeatedly tested claims against evidence. You were especially attentive to what the clinical findings, chronology, and contact network actually established."
  },

  BLAME:{
    title:"RESPONSIBILITY",
    body:
      "You repeatedly noticed decisions that might make someone responsible: working while ill, exposing others, or appearing to occupy the center of the transmission chain."
  },

  CARE:{
    title:"CARE",
    body:
      "You repeatedly focused on the people experiencing the outbreak: fear, isolation, relationships, and what people owed one another."
  },

  WITNESS:{
    title:"PERSPECTIVE",
    body:
      "You repeatedly sought perspectives that could remain peripheral to the official medical account: patients, friends, families, and people watching events unfold."
  }
};


/* =========================================================
   CASE NOTES
   ========================================================= */

const drawer =
  document.getElementById("drawer");

const scrim =
  document.getElementById("scrim");

document.getElementById("notesBtn").onclick =
  openNotes;

document.getElementById("closeNotes").onclick =
  closeNotes;

scrim.onclick =
  closeNotes;


function fillList(id,items){

  document.getElementById(id).innerHTML =
    items.length
      ? items.map(
          item => `<li>${item}</li>`
        ).join("")
      : `<li class="small">None recorded.</li>`;
}


function updateNotes(){

  fillList(
    "knownNotes",
    state.notes.known
  );

  fillList(
    "reportedNotes",
    state.notes.reported
  );

  fillList(
    "unconfirmedNotes",
    state.notes.unconfirmed
  );

  document.getElementById("dxNote").innerHTML =
    `<strong>${state.diagnosis}</strong>`;
}


function openNotes(){

  updateNotes();

  drawer.classList.add("open");

  scrim.classList.remove("hidden");
}


function closeNotes(){

  drawer.classList.remove("open");

  scrim.classList.add("hidden");
}


/* =========================================================
   RECORD CHOICES
   ========================================================= */

function record(text,scores,key){

  Object.entries(scores || {}).forEach(
    ([name,value]) => {

      state.scores[name] += value;
    }
  );


  /*
     DETECTIVE SCORE:
     5  = recognize airport as hypothesis
     5  = complete first investigation
     10 = diagnose meningitis early
     10 = catch timeline contradiction
     5  = Jordan breaks party hypothesis
     10 = identify Caleb
     5  = distinguish link from source

     MAXIMUM = 50
  */

  if(key === "hypothesis-not-fact"){

    award(
      5,
      "hypothesis-score"
    );
  }


  const diagnosisMap = {

    "dx-food":
      "Food poisoning",

    "dx-viral":
      "Flu/COVID or another respiratory virus",

    "dx-meningitis":
      "Meningitis",

    "dx-toxic":
      "Poisoning or toxic exposure",

    "dx-unknown":
      "Not enough information yet",

    "dx2-food":
      "Food poisoning",

    "dx2-viral":
      "Flu/COVID or another respiratory virus",

    "dx2-meningitis":
      "Meningococcal meningitis",

    "dx2-toxic":
      "Poisoning or toxic exposure"
  };


  if(diagnosisMap[key]){

    state.diagnosis =
      diagnosisMap[key];

    state.dxHistory.push(
      state.diagnosis
    );
  }


  if(
    key &&
    key.startsWith("pov-")
  ){

    state.finalPOV =
      key.replace(
        "pov-",
        ""
      );
  }


  state.choices.push(text);
}


/* =========================================================
   RENDER SCENES
   ========================================================= */

function render(id){

  closeNotes();


  if(id === "results"){

    renderResults();

    return;
  }


  const scene =
    scenes[id];


  if(!scene){

    document.getElementById("game").innerHTML = `

      <h2>Game Error</h2>

      <p>
        The game tried to open a scene called
        <strong>${id}</strong>, but that scene does not exist.
      </p>

      <p>
        Please tell your instructor which button you clicked
        immediately before this message appeared.
      </p>
    `;

    return;
  }


  if(scene.onEnter){

    scene.onEnter();
  }


  const game =
    document.getElementById("game");


  let html = "";


  if(scene.time){

    html += `

      <div class="timestamp">
        ${scene.time}
      </div>

      <div class="location">
        PITTSBURGH TRAUMA MEDICAL CENTER · EMERGENCY DEPARTMENT
      </div>
    `;
  }


  if(scene.title){

    html += `
      <h2>
        ${scene.title}
      </h2>
    `;
  }


  html +=
    scene.html || "";


  if(scene.prompt){

    html += `

      <div class="prompt">
        ${scene.prompt}
      </div>

      <div class="choices">
    `;


    scene.choices.forEach(
      (choice,index) => {

        html += `

          <button
            class="choice"
            data-index="${index}"
          >
            <b>${choice[0]}</b>
            ${choice[1]}
          </button>
        `;
      }
    );


    html += `
      </div>
    `;

  }else if(scene.next){

    html += `

      <button
        class="continue"
        id="continueBtn"
      >
        ${scene.button || "CONTINUE"}
      </button>
    `;
  }


  game.innerHTML =
    html;


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  if(scene.afterRender){

    scene.afterRender();
  }


  if(scene.prompt){

    game
      .querySelectorAll(".choice")
      .forEach(
        button => {

          button.onclick = () => {

            const choice =
              scene.choices[
                Number(
                  button.dataset.index
                )
              ];


            record(
              choice[1],
              choice[2],
              choice[4]
            );


            render(
              choice[3]
            );
          };
        }
      );

  }else if(scene.next){

    document
      .getElementById("continueBtn")
      .onclick =
        () => render(scene.next);
  }
}


/* =========================================================
   FINAL SCORE
   ========================================================= */

function rankForScore(score){

  if(score >= 45){

    return {

      rank:"ROBBY-LEVEL",

      text:
        "You diagnosed the disease, resisted the false lead, and reconstructed the contact network."
    };
  }


  if(score >= 35){

    return {

      rank:"DIAGNOSTIC ACE",

      text:
        "You solved the central medical mystery and followed the outbreak evidence carefully."
    };
  }


  if(score >= 25){

    return {

      rank:"RESIDENT MATERIAL",

      text:
        "You followed several important clues and avoided some of the case's false leads."
    };
  }


  return {

    rank:"ROOKIE DETECTIVE",

    text:
      "You made it through the case. Another run may reveal clues you did not follow the first time."
  };
}
